<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Comptia Security+ - Dominios</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside id="domainSidebar" class="sidebar" aria-label="Menu de dominios">
        <h1 class="brand">Comptia Security+</h1>
        <nav id="domainMenu" class="domain-menu" aria-label="Dominios"></nav>
        <div class="sidebar-section">
          <p class="sidebar-label">Material de estudio</p>
          <button id="summaryMenuButton" class="sidebar-action" type="button">Resúmenes / chuletas</button>
          <button id="testMenuButton" class="sidebar-action" type="button">Tests</button>
        </div>
        <section class="toc" aria-label="Indice del dominio">
          <p class="toc-title">Indice</p>
          <ol id="tocList" class="toc-list"></ol>
        </section>
      </aside>
      <button id="menuBackdrop" class="menu-backdrop" type="button" aria-label="Cerrar menu"></button>

      <main class="main">
        <div class="toolbar">
          <button id="menuToggle" class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="domainSidebar" aria-expanded="false">
            <span class="menu-toggle-lines" aria-hidden="true"></span>
          </button>
          <input id="searchInput" class="search" type="search" placeholder="Buscar en el dominio actual" autocomplete="off">
          <button id="epubButton" class="action-button" type="button">EPUB completo</button>
          <button id="printButton" class="action-button" type="button">Imprimir</button>
        </div>

        <section id="content" class="content-panel" aria-live="polite">
          <div class="empty-state">Selecciona un dominio para ver el contenido completo.</div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
